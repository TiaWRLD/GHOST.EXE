<!doctype html>
<html><head><meta charset="utf-8"><title>Terminal</title>
    <style>
        body { margin: 0; padding: 14px; background: #050505; color: #33ff66;
            font: 14px ui-monospace, Menlo, Consolas, monospace; }
        #out { white-space: pre-wrap; }
        #prompt { display: none; align-items: center; }
        #in { flex: 1; background: transparent; border: none; outline: none;
            color: inherit; font: inherit; caret-color: #33ff66; padding: 0 0 0 8px; }
    </style></head>
<body>
<div id="out"></div>
<div id="prompt">&gt;<input id="in" autocomplete="off" spellcheck="false"></div>
<script>
    const out = document.getElementById('out');
    const prompt = document.getElementById('prompt');
    const input = document.getElementById('in');
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const toBottom = () => window.scrollTo(0, document.body.scrollHeight);
    let queue = Promise.resolve();
    let pending = 0;   // spirit messages still being typed

    // payload: an array of lines (old format) or { lines, prompt }.
    // prompt:false = the input line never comes back after this message (endings)
    ghost.onSay(payload => {
        const lines = Array.isArray(payload) ? payload : payload.lines;
        const showPrompt = Array.isArray(payload) ? true : payload.prompt !== false;
        pending++;
        prompt.style.display = 'none';
        queue = queue.then(async () => {
            for (const line of lines) {
                for (const ch of line) { out.textContent += ch; await wait(40 + Math.random() * 80); }
                out.textContent += '\n';
                toBottom();
                await wait(900);
            }
            if (--pending === 0 && showPrompt) { prompt.style.display = 'flex'; input.focus(); toBottom(); }
        });
    });

    input.addEventListener('keydown', e => {
        if (e.key !== 'Enter') return;
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        out.textContent += '> ' + text + '\n';
        prompt.style.display = 'none';          // comes back when the spirit answers
        ghost.userSaid(text);
    });
</script>
</body></html>
