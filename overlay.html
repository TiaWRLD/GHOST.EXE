<!doctype html>
<html><head><meta charset="utf-8">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }

        /* #world holds everything that shakes. #stage centers the files that sit in the middle;
           #loose holds files that were moved somewhere else (absolute positions). */
        #world { position: fixed; inset: 0; }
        #stage { position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center; }
        #files { display: flex; gap: 40px; }
        #loose { position: absolute; inset: 0; pointer-events: none; }

        .file { width: 360px; text-align: center; color: #fff; cursor: default;
            font: 600 34px -apple-system, "Segoe UI", sans-serif;
            text-shadow: 0 2px 6px #000; }
        .file .ico { height: 200px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 24px rgba(255, 40, 40, 0.55)); }
        .file .ico svg { width: 200px; height: 200px; }
        .file.loose { position: absolute; pointer-events: auto; }

        #shot { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }

        /* ---- Fake system error box (styled per OS in JS) ---- */
        #err { position: fixed; left: 50%; top: 22%; transform: translateX(-50%);
            display: none; z-index: 10; user-select: none; }
        #err .icon { flex: none; }
        #err .icon svg { display: block; }
        #err .msg { flex: 1; }
        #err .code { opacity: .6; font-size: 11px; margin-top: 8px; }
        #err button { font: inherit; cursor: default; }
        #err .mt { display: none; }

        #err.win { width: 420px; background: #f0f0f0; color: #000; border: 1px solid #6b6b6b;
            box-shadow: 0 10px 30px rgba(0,0,0,.5); font: 12px "Segoe UI", sans-serif; }
        #err.win .bar { background: #fff; padding: 8px 12px; }
        #err.win .body { display: flex; gap: 14px; padding: 22px 20px; background: #fff; }
        #err.win .icon svg { width: 32px; height: 32px; }
        #err.win .foot { background: #f0f0f0; padding: 12px; text-align: right; }
        #err.win button { min-width: 80px; padding: 4px 12px; background: #e1e1e1; border: 1px solid #adadad; }

        #err.mac { width: 300px; background: rgba(40,40,40,.96); color: #fff; border-radius: 14px;
            padding: 22px 20px 16px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.6);
            font: 13px -apple-system, "SF Pro Text", sans-serif; }
        #err.mac .bar { display: none; }
        #err.mac .body { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #err.mac .icon svg { width: 56px; height: 56px; }
        #err.mac .mt { display: block; font-weight: 700; font-size: 14px; }
        #err.mac .foot { margin-top: 16px; }
        #err.mac button { width: 100%; padding: 5px 0; background: #0a84ff; color: #fff;
            border: none; border-radius: 6px; }

        #err.linux { width: 380px; background: #2d2d2d; color: #eee; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.6); font: 14px Cantarell, "Ubuntu", sans-serif; }
        #err.linux .bar { padding: 12px 18px 0; font-weight: 700; }
        #err.linux .body { display: flex; gap: 14px; padding: 16px 18px; }
        #err.linux .icon svg { width: 36px; height: 36px; }
        #err.linux .foot { padding: 0 18px 16px; text-align: right; }
        #err.linux button { padding: 6px 18px; background: #444; color: #eee; border: none; border-radius: 6px; }
    </style></head>
<body>
<div id="world">
    <div id="stage"><div id="files"></div></div>
    <div id="loose"></div>
</div>
<img id="shot">
<div id="err"></div>
<script src="icons.js"></script>
<script>
    const world = document.getElementById('world');
    const files = document.getElementById('files');
    const loose = document.getElementById('loose');
    const shot = document.getElementById('shot');
    const errBox = document.getElementById('err');

    // 'win' | 'mac' | 'linux': picks the look of icons and of the fake error box
    const OS = ghost.platform === 'win32' ? 'win' : ghost.platform === 'darwin' ? 'mac' : 'linux';
    Icons.install();

    // ---------- Audio (all synthesized, no audio files) ----------
    const MASTER = 0.8;
    let actx, master, droneGain, droneFilter, noiseBuf, reverbSend;
    let beatTimer = null, beatBpm = 0, heartGain = null, silenceTimer = null;

    // Tuning knobs. Level 0 = off, 5 = maximum.
    const DRONE_GAIN   = [0, 0.05, 0.09, 0.14, 0.20, 0.26];
    const DRONE_CUTOFF = [100, 160, 220, 300, 420, 600];     // Hz: higher = brighter, harsher
    const HEART_BPM    = [0, 54, 66, 80, 98, 118];
    const HEART_VOL    = [0, 0.30, 0.40, 0.55, 0.70, 0.85];
    const WHISPER_VOL  = 0.45;
    const BREATH_VOL   = 0.7;

    function initAudio() {
        actx = new AudioContext();

        // master -> compressor -> speakers (the compressor stops stacked sounds from clipping)
        master = actx.createGain();
        master.gain.value = MASTER;
        const comp = actx.createDynamicsCompressor();
        comp.threshold.value = -18;
        comp.ratio.value = 6;
        master.connect(comp).connect(actx.destination);

        // 2 seconds of white noise, reused by whispers, clicks and thuds
        noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

        // Small reverb from a decaying-noise impulse response.
        // Whispers and breaths go through it so they sound like they are "in the room".
        const reverb = actx.createConvolver();
        const irLen = Math.floor(actx.sampleRate * 2.2);
        const ir = actx.createBuffer(2, irLen, actx.sampleRate);
        for (let c = 0; c < 2; c++) {
            const d = ir.getChannelData(c);
            for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 3);
        }
        reverb.buffer = ir;
        reverbSend = actx.createGain();
        const reverbOut = actx.createGain();
        reverbOut.gain.value = 0.5;
        reverbSend.connect(reverb);
        reverb.connect(reverbOut).connect(master);

        // Heartbeat bus
        heartGain = actx.createGain();
        heartGain.gain.value = 0;
        heartGain.connect(master);

        // Drone: three slightly detuned oscillators -> slow beating between them
        droneFilter = actx.createBiquadFilter();
        droneFilter.type = 'lowpass';
        droneFilter.frequency.value = DRONE_CUTOFF[0];
        droneFilter.Q.value = 1.2;

        droneGain = actx.createGain();
        droneGain.gain.value = 0;
        droneFilter.connect(droneGain).connect(master);

        [[82.4, 'sawtooth'], [83.2, 'sawtooth'], [164.8, 'sine']].forEach(([freq, type]) => {
            const o = actx.createOscillator();
            o.type = type;
            o.frequency.value = freq;
            const g = actx.createGain();
            g.gain.value = type === 'sine' ? 0.5 : 0.35;
            o.connect(g).connect(droneFilter);
            o.start();
        });

        // Slow LFO makes the filter "breathe"
        const lfo = actx.createOscillator();
        lfo.frequency.value = 0.07;
        const lfoDepth = actx.createGain();
        lfoDepth.gain.value = 50;
        lfo.connect(lfoDepth).connect(droneFilter.frequency);
        lfo.start();

        ghost.log('audio state: ' + actx.state);
        if (actx.state === 'suspended') {
            actx.resume().then(() => ghost.log('audio state after resume: ' + actx.state));
        }
    }

    function noiseSource() {
        const s = actx.createBufferSource();
        s.buffer = noiseBuf;
        s.loop = true;
        return s;
    }

    // --- Drone ---
    function setDrone(level, fadeSeconds = 2) {
        const l = Math.max(0, Math.min(5, level | 0));
        const t = actx.currentTime;
        droneGain.gain.setTargetAtTime(DRONE_GAIN[l], t, fadeSeconds / 3);
        droneFilter.frequency.setTargetAtTime(DRONE_CUTOFF[l], t, fadeSeconds / 3);
    }

    // --- Heartbeat: "lub-dub", speeds up with the level ---
    function thump(freq, vol, t) {
        // a sine that drops in pitch + a triangle one octave up (so laptop speakers can reproduce it)
        [[freq, 'sine', 1], [freq * 2, 'triangle', 0.35]].forEach(([f, type, k]) => {
            const o = actx.createOscillator();
            o.type = type;
            o.frequency.setValueAtTime(f, t);
            o.frequency.exponentialRampToValueAtTime(f * 0.5, t + 0.15);
            const g = actx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(vol * k, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            o.connect(g).connect(heartGain);
            o.start(t);
            o.stop(t + 0.25);
        });
    }

    function beatLoop() {
        if (!beatBpm) return;
        const period = 60 / beatBpm;
        const t = actx.currentTime + 0.02;
        thump(75, 1.0, t);                                    // lub
        thump(62, 0.65, t + Math.min(0.22, period * 0.4));    // dub
        beatTimer = setTimeout(beatLoop, period * 1000);
    }

    function setHeartbeat(level) {
        const l = Math.max(0, Math.min(5, level | 0));
        beatBpm = HEART_BPM[l];
        heartGain.gain.setTargetAtTime(HEART_VOL[l], actx.currentTime, 0.5);
        clearTimeout(beatTimer);
        if (beatBpm) beatLoop(); else beatTimer = null;
    }

    // --- Whisper: aspirated noise shaped by vowel formants, syllable by syllable ---
    // [F1, F2, F3] in Hz for a few vowels: the mouth's resonances are what makes noise sound like speech
    const VOWELS = [
        [730, 1090, 2440],   // a
        [270, 2290, 3010],   // i
        [300,  870, 2240],   // u
        [530, 1840, 2480],   // e
        [570,  840, 2410]    // o
    ];

    function whisper() {
        let t = actx.currentTime + 0.02;
        const syllables = 4 + Math.floor(Math.random() * 4);

        // random position in the stereo field + a send to the reverb
        const pan = actx.createStereoPanner();
        pan.pan.value = (Math.random() * 2 - 1) * 0.7;
        const out = actx.createGain();
        out.gain.value = WHISPER_VOL;
        const send = actx.createGain();
        send.gain.value = 0.7;
        out.connect(pan);
        pan.connect(master);
        pan.connect(send).connect(reverbSend);

        for (let i = 0; i < syllables; i++) {
            const v = VOWELS[Math.floor(Math.random() * VOWELS.length)];
            const dur = 0.09 + Math.random() * 0.14;

            const env = actx.createGain();
            env.gain.setValueAtTime(0.0001, t);
            env.gain.exponentialRampToValueAtTime(1, t + dur * 0.35);
            env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            env.connect(out);

            // three narrow band-pass filters in parallel = three formants.
            // The gains are high because narrow filters let very little noise through.
            const src = noiseSource();
            [[v[0], 5, 7], [v[1], 6, 5], [v[2], 7, 2.5]].forEach(([f, q, gain]) => {
                const bp = actx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.value = f * (0.95 + Math.random() * 0.1);
                bp.Q.value = q;
                const g = actx.createGain();
                g.gain.value = gain;
                src.connect(bp).connect(g).connect(env);
            });
            src.start(t, Math.random() * 1.5);
            src.stop(t + dur + 0.05);

            // on half of the syllables, a short "s/sh" hiss at the start
            if (Math.random() < 0.5) {
                const hs = noiseSource();
                const hp = actx.createBiquadFilter();
                hp.type = 'highpass';
                hp.frequency.value = 4500;
                const hg = actx.createGain();
                hg.gain.setValueAtTime(0.0001, t);
                hg.gain.exponentialRampToValueAtTime(0.35, t + 0.03);
                hg.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
                hs.connect(hp).connect(hg).connect(out);
                hs.start(t, Math.random() * 1.5);
                hs.stop(t + 0.12);
            }

            t += dur + 0.03 + Math.random() * 0.12;   // irregular gap between syllables
        }
    }

    // --- Breath: a short inhale, a small pause, a long exhale. Different every time. ---
    // One half of a breath. 'in' = shorter, thinner, rising. 'out' = longer, lower, louder.
    function breathPhase(t, dur, peak, kind, dest) {
        const inhale = kind === 'in';

        // Soft noise: lowpassed so it is not hissy like the raw white noise
        const src = noiseSource();
        const soft = actx.createBiquadFilter();
        soft.type = 'lowpass';
        soft.frequency.value = inhale ? 4200 : 3200;

        // Two wide resonances, like the "h" of a breathed "ha". Inhale is higher and thinner.
        const f1 = inhale ? 800 + Math.random() * 200 : 600 + Math.random() * 150;
        const f2 = inhale ? 1900 + Math.random() * 300 : 1150 + Math.random() * 250;
        const tone = actx.createGain();
        [[f1, 1.6, 2.2], [f2, 1.8, 1.4]].forEach(([f, q, gain]) => {
            const bp = actx.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(f * (inhale ? 0.85 : 1.1), t);
            bp.frequency.linearRampToValueAtTime(f * (inhale ? 1.12 : 0.8), t + dur);   // inhale rises, exhale falls
            bp.Q.value = q;
            const g = actx.createGain();
            g.gain.value = gain;
            soft.connect(bp).connect(g).connect(tone);
        });
        src.connect(soft);

        // Airflow flutter: two slow, out-of-sync oscillators make the level wobble irregularly
        const flutter = actx.createGain();
        flutter.gain.value = 0.8;
        [[2.3 + Math.random() * 2, 0.12], [6 + Math.random() * 4, 0.07]].forEach(([rate, depth]) => {
            const lfo = actx.createOscillator();
            lfo.frequency.value = rate;
            const d = actx.createGain();
            d.gain.value = depth;
            lfo.connect(d).connect(flutter.gain);
            lfo.start(t);
            lfo.stop(t + dur + 0.1);
        });

        // Envelope: inhale builds slowly then stops; exhale starts fast then trails away
        const env = actx.createGain();
        env.gain.setValueAtTime(0.0001, t);
        if (inhale) {
            env.gain.exponentialRampToValueAtTime(peak, t + dur * 0.8);
            env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        } else {
            env.gain.exponentialRampToValueAtTime(peak, t + dur * 0.18);
            env.gain.exponentialRampToValueAtTime(peak * 0.35, t + dur * 0.6);
            env.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        }

        tone.connect(flutter).connect(env).connect(dest);
        src.start(t, Math.random() * 1.5);
        src.stop(t + dur + 0.1);
    }

    function breath() {
        const t = actx.currentTime + 0.02;
        const inDur  = 0.9 + Math.random() * 0.5;
        const gap    = 0.15 + Math.random() * 0.25;
        const outDur = 1.8 + Math.random() * 0.8;

        // random stereo position + reverb send (same idea as the whisper)
        const pan = actx.createStereoPanner();
        pan.pan.value = (Math.random() * 2 - 1) * 0.6;
        const out = actx.createGain();
        out.gain.value = 1;
        const send = actx.createGain();
        send.gain.value = 0.6;
        out.connect(pan);
        pan.connect(master);
        pan.connect(send).connect(reverbSend);

        breathPhase(t, inDur, BREATH_VOL * 0.5, 'in', out);
        breathPhase(t + inDur + gap, outDur, BREATH_VOL, 'out', out);
    }

    // --- Glitch: electrical clicks + a short buzz, synced with shakes ---
    function click(t, vol) {
        const src = noiseSource();
        const hp = actx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 2500 + Math.random() * 3000;
        const len = 0.01 + Math.random() * 0.03;
        const g = actx.createGain();
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + len);
        src.connect(hp).connect(g).connect(master);
        src.start(t, Math.random());
        src.stop(t + len + 0.02);
    }

    function glitch(intensity = 6, duration = 400) {
        const t = actx.currentTime;
        const n = 2 + Math.round(intensity / 2);
        for (let i = 0; i < n; i++) click(t + Math.random() * duration / 1000, 0.25 + Math.random() * 0.25);

        const o = actx.createOscillator();
        o.type = 'square';
        o.frequency.value = 100 + Math.random() * 300;
        const len = Math.min(duration / 1000, 0.25);
        const g = actx.createGain();
        g.gain.setValueAtTime(0.05, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + len);
        o.connect(g).connect(master);
        o.start(t);
        o.stop(t + len + 0.02);
    }

    // --- Thud: the dull impact (climax, strong shakes) ---
    function thud(vol = 1) {
        const t = actx.currentTime;
        [[90, 35, 'sine', 0.9, 0.9], [180, 70, 'triangle', 0.35, 0.4]].forEach(([f0, f1, type, k, len]) => {
            const o = actx.createOscillator();
            o.type = type;
            o.frequency.setValueAtTime(f0, t);
            o.frequency.exponentialRampToValueAtTime(f1, t + 0.35);
            const g = actx.createGain();
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(vol * k, t + 0.005);
            g.gain.exponentialRampToValueAtTime(0.001, t + len);
            o.connect(g).connect(master);
            o.start(t);
            o.stop(t + len + 0.05);
        });
        // a burst of low noise gives it body
        const src = noiseSource();
        const lp = actx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 400;
        const ng = actx.createGain();
        ng.gain.setValueAtTime(vol * 0.5, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        src.connect(lp).connect(ng).connect(master);
        src.start(t, Math.random());
        src.stop(t + 0.2);
    }

    // --- Silence: everything cuts out at once, then (optionally) comes back ---
    function silence(ms = 2000, restore = true) {
        clearTimeout(silenceTimer);
        master.gain.cancelScheduledValues(actx.currentTime);
        master.gain.setTargetAtTime(0, actx.currentTime, 0.015);
        if (restore) {
            silenceTimer = setTimeout(
                () => master.gain.setTargetAtTime(MASTER, actx.currentTime, 0.05), ms);
        }
    }

    // Commands from main: { sound: 'drone' | 'heartbeat' | 'whisper' | 'breath' |
    //                       'glitch' | 'thud' | 'silence', ...options }
    ghost.onSound(cmd => {
        if (!actx) return;
        switch (cmd.sound) {
            case 'drone':     setDrone(cmd.level, cmd.fade); break;
            case 'heartbeat': setHeartbeat(cmd.level); break;
            case 'whisper':   whisper(); break;
            case 'breath':    breath(); break;
            case 'glitch':    glitch(cmd.intensity, cmd.duration); break;
            case 'thud':      thud(cmd.vol); break;
            case 'silence':   silence(cmd.ms, cmd.restore !== false); break;
        }
    });

    initAudio();

    // ---------- Effects ----------
    function jitter(el, intensity, duration, done) {
        const start = performance.now();
        (function frame(now) {
            const k = 1 - (now - start) / duration;
            if (k <= 0) { el.style.transform = ''; el.style.filter = ''; return done && done(); }
            const x = (Math.random() - 0.5) * 2 * intensity * k;
            const y = (Math.random() - 0.5) * 2 * intensity * k;
            el.style.transform = `translate(${x}px, ${y}px) scale(1.03)`;
            el.style.filter = Math.random() < 0.04 ? 'invert(1)' : '';   // occasional flash
            requestAnimationFrame(frame);
        })(start);
    }

    ghost.onShake(({ img, intensity, duration }) => {
        // sound is tied to the shake here, so image and audio can never drift apart
        if (actx) {
            glitch(intensity, duration);
            if (intensity >= 6) thud(Math.min(1, intensity / 12));
        }
        if (img) {
            shot.src = img;
            shot.decode().then(() => {
                shot.style.display = 'block';
                jitter(shot, intensity, duration, () => shot.style.display = 'none');
            });
        } else {
            jitter(world, intensity * 2, duration);   // fallback if screen permission is missing
        }
    });

    // ---------- Fake desktop items ----------
    // icon: 'file' | 'folder' (anything else is drawn as a file)
    function createFile({ name, icon }) {
        const el = document.createElement('div');
        el.className = 'file';
        el.dataset.name = name;
        const ico = document.createElement('div');
        ico.className = 'ico';
        // the SVG strings come from icons.js (static, trusted); the name below is set as plain text
        ico.innerHTML = icon === 'folder' ? Icons.folder(OS) : Icons.file(OS);
        const label = document.createElement('div');
        label.textContent = name;
        el.append(ico, label);
        // the overlay is click-through, except while the mouse is over a file
        el.addEventListener('mouseenter', () => ghost.setClickable(true));
        el.addEventListener('mouseleave', () => ghost.setClickable(false));
        el.addEventListener('dblclick', () => { ghost.setClickable(false); ghost.fileOpened(name); });
        return el;
    }

    // Files can be in the centered row (#files) or moved out to #loose
    function findFile(name) {
        return [...files.children, ...loose.children].find(e => e.dataset.name === name) || null;
    }

    ghost.onSpawnFile(d => files.appendChild(createFile(d)));

    ghost.onRemoveFile(d => {
        const el = d && d.name ? findFile(d.name) : (files.lastElementChild || loose.lastElementChild);
        if (!el) return;
        jitter(el, 14, 500, () => {
            el.remove();
            // if the cursor was over it, mouseleave never fires: give the desktop its clicks back
            ghost.setClickable(false);
        });
    });

    // A random spot away from the center of the screen
    function randomSpot() {
        const pad = 20, w = 360, h = 290;
        const maxX = Math.max(pad, innerWidth - w - pad);
        const left = Math.random() < 0.5
            ? pad + Math.random() * Math.max(0, Math.min(maxX, innerWidth * 0.22) - pad)
            : Math.min(maxX, innerWidth * 0.62) + Math.random() * Math.max(0, maxX - innerWidth * 0.62);
        const top = pad + Math.random() * Math.max(0, innerHeight - h - 2 * pad);
        return { left, top };
    }

    // The file shakes, vanishes, and comes back somewhere else
    ghost.onMoveFile(({ name }) => {
        const el = findFile(name);
        if (!el) return;
        jitter(el, 12, 450, () => {
            el.style.visibility = 'hidden';
            ghost.setClickable(false);
            setTimeout(() => {
                const { left, top } = randomSpot();
                if (el.parentElement !== loose) { loose.appendChild(el); el.classList.add('loose'); }
                el.style.left = left + 'px';
                el.style.top = top + 'px';
                el.style.visibility = 'visible';
                if (actx) glitch(5, 250);
                jitter(el, 6, 200);
            }, 500);
        });
    });

    // ---------- Fake system error (styled for the current OS) ----------
    let errTimer = null;

    function hideErr(byUser) {
        if (errBox.style.display === 'none' || errBox.style.display === '') return;
        clearTimeout(errTimer);
        errBox.style.display = 'none';
        ghost.setClickable(false);
        ghost.errorDismissed(byUser);
    }

    function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    ghost.onFakeError(({ text, code }) => {
        hideErr(false);   // only one box at a time
        const title = { win: 'System Error', mac: 'System Warning', linux: 'Error' }[OS];
        const btn   = OS === 'linux' ? 'Close' : 'OK';

        errBox.className = OS;
        errBox.textContent = '';
        const msg = el('div', 'msg');
        msg.append(el('div', 'mt', title), el('div', 't', text), el('div', 'code', 'Error code: ' + code));
        const icon = el('div', 'icon');
        icon.innerHTML = Icons.error(OS);          // static SVG from icons.js
        const body = el('div', 'body');
        body.append(icon, msg);
        const button = el('button', '', btn);
        button.addEventListener('click', () => hideErr(true));
        const foot = el('div', 'foot');
        foot.append(button);
        errBox.append(el('div', 'bar', title), body, foot);

        errBox.addEventListener('mouseenter', () => ghost.setClickable(true));
        errBox.addEventListener('mouseleave', () => ghost.setClickable(false));
        errBox.style.display = 'block';          // it just appears: no animation
        if (actx) { glitch(8, 300); thud(0.5); }
        errTimer = setTimeout(() => hideErr(false), 14000);
    });
</script>
</body></html>
